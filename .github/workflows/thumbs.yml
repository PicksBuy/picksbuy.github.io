name: Card thumbnails
on:
  push:
    branches: [main]
    paths: ['img/**', '!img/t/**', 'tools/thumbs.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/thumbs.py
      - name: Commit
        run: |
          git config user.name "picksbuy-bot"
          git config user.email "picksbuy-bot@users.noreply.github.com"
          git add -A img/t || true
          git diff --cached --quiet || git commit -m "Card thumbnails"
          git pull --rebase origin main && git push
