name: Fetch product images
on:
  push:
    branches: [main]
    paths: [import/images.json, tools/fetch_images.py, tools/probe_nyx.py, tools/find_sd.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - run: python tools/fetch_images.py
      - run: python tools/probe_nyx.py || true
      - run: python tools/find_sd.py && python tools/fetch_images.py || true
      - name: Commit images
        run: |
          git config user.name "picksbuy-bot"
          git config user.email "picksbuy-bot@users.noreply.github.com"
          git add -A img import || true
          git diff --cached --quiet || git commit -m "Add downloaded product images"
          git pull --rebase origin main && git push
