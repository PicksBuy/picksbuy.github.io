      try{ const t=await (await fetch('import/upgrade-2.sql?v='+Date.now(),{cache:'no-store'})).text(); await navigator.clipboard.writeText(t); toast('اتنسخ ✅ روح الصقه في SQL Editor'); }
      catch(e){ toast('مقدرتش أنسخ، جرّب تاني'); }
    };
  };
}

/* ---------- ready-made batches prepared by Claude (import/batch.json) ---------- */
let BATCH=null;
async function checkImports(){
  const box=$('#imp'); box.innerHTML='';
  if(!S.canEdit) return;
  try{ BATCH=await (await fetch('import/batch.json?v='+Date.now(),{cache:'no-store'})).json(); }catch(e){ BATCH=null; return; }
  const rules=(BATCH.expire||[]).filter(r=>!(S.settings.expire||[]).some(x=>x.key===r.key));
  if(rules.length){ try{ ok(await sb.from('settings').upsert({id:1,data:{...S.settings,expire:[...(S.settings.expire||[]),...rules]}})); await refresh('settings'); }catch(e){ console.warn('expire',e); } }
  if(S.expiredGone&&S.expiredGone.length){ try{
    ok(await sb.from('products').delete().in('id',S.expiredGone));
    toast(`اتمسحت ${S.expiredGone.length} عروض خلصت ⏰`); S.expiredGone=[];
  }catch(e){ console.warn('expire-del',e); } }
  const done=new Set(S.settings.imported||[]);
  const ups=(BATCH.updates||[]).filter(u=>!done.has(u.key)&&S.products.some(p=>p.id===u.id));
  if(ups.length){ try{
    const now=new Date().toISOString();
    for(const u of ups) ok(await sb.from('products').update(toRow('products',{...u.set,updatedAt:now})).eq('id',u.id));
    ok(await sb.from('settings').upsert({id:1,data:{...S.settings,imported:[...new Set([...done,...ups.map(u=>u.key)])]}}));
    await Promise.all(['products','settings'].map(refresh));
    toast(`اتحدثت صور ${ups.length} منتج ✅`);
  }catch(e){ console.warn('updates',e); } }
  const seen=new Set([...(S.settings.imported||[]), ...S.products.map(p=>p.id)]);
  const items=(BATCH.products||[]).filter(p=>!seen.has(p.id)&&!isExpired({...p,id:p.id}));
  if(!items.length) return;
  box.innerHTML=`<div class="impbar"><span style="font-size:24px">📦</span><b>${items.length} منتج جديد جاهز تضيفه</b><button id="impGo">شوف وأضف</button></div>`;
  $('#impGo').onclick=()=>openImport(items);
}
function openImport(items){
  const ov=sheet('منتجات جديدة جاهزة',`
    <div class="hint" style="margin-bottom:6px">شيل العلامة من أي منتج مش عايزه. المنتجات اللي مكتوب عليها "محتاج سعر" هتتضاف مخفية لحد ما تحط سعرها من ✏️ تعديل.</div>
    <div class="impl">${items.map(p=>{ const c=country(p.countryId);
      return `<label><input type="checkbox" data-iid="${esc(p.id)}" checked>${p.images[0]?`<img src="${img(p.images[0])}" alt="">`:''}
        <div class="t">${p.brand?`<div class="brand-l" style="font-size:10px">${esc(p.brand)}</div>`:''}<div class="n">${esc(p.name)}</div>
        <div class="hint">${c?esc((c.flag||'')+' '+c.name)+' · ':''}${p.needsPrice?'<b style="color:var(--warn)">محتاج سعر</b>':`<b style="color:var(--red)" dir="ltr">${fmt(p.price)} ${esc(cur())}</b>`}${p.promo?' · 🔥':''}${p.sizes&&p.sizes.length?' · '+p.sizes.length+' أنواع':''}</div></div></label>`; }).join('')}</div>`,
    `<button class="btn" data-close>مش دلوقتي</button><button class="btn r" id="impRun">أضف المنتجات</button>`);
  const btn=ov.querySelector('#impRun');
  const count=()=>{ const n=ov.querySelectorAll('[data-iid]:checked').length; btn.textContent=n?`أضف ${n} منتج`:'تجاهل الكل'; };
  ov.querySelector('.impl').addEventListener('change',count); count();
  btn.onclick=async()=>{
    const pick=new Set([...ov.querySelectorAll('[data-iid]:checked')].map(i=>i.dataset.iid));
    btn.disabled=true; btn.textContent='بيضيف…';
    try{
      const haveC=new Set(S.cats.map(c=>c.id));
      const newC=(BATCH.categories||[]).filter(c=>!haveC.has(c.id));
      if(newC.length) ok(await sb.from('categories').upsert(newC.map(c=>toRow('categories',c))));
      const now=new Date().toISOString();
      const rows=items.filter(p=>pick.has(p.id)).map(p=>{ const {needsPrice,src,...d}=p; return toRow('products',{...d,updatedAt:now}); });
      if(rows.length) ok(await sb.from('products').upsert(rows));
      const data={...S.settings, imported:[...new Set([...(S.settings.imported||[]), ...items.map(p=>p.id)])]};
      const sp=BATCH.settingsPatch;
      if(sp && !data.imported.includes(sp.id)){ data.promo={...(data.promo||{}),...(sp.promo||{})}; data.imported.push(sp.id); }
      ok(await sb.from('settings').upsert({id:1,data}));
      await Promise.all(['categories','products','settings'].map(refresh));
      ov.close(); $('#imp').innerHTML='';
      toast(rows.length?`اتضاف ${rows.length} منتج ✅`:'تمام');
    }catch(e){ btn.disabled=false; count(); toast('حصلت مشكلة، جرّب تاني'); }
  };
}

/* ---------- join the WhatsApp group popup ---------- */
function groupLink(){ const g=String(S.settings.group||'').trim(); return /^https:\/\/(chat\.whatsapp\.com|wa\.me|whatsapp\.com)\//i.test(g)?g:''; }
function paintGroup(){ const g=groupLink(), a=$('#grpLink'); a.style.display=g?'inline':'none'; $('#grpSep').style.display=g?'inline':'none'; if(g) a.href=g; }
function maybeJoinPopup(){
  const g=groupLink(); if(!g || S.canEdit || document.querySelector('.ov:not(.out)')) return;
  let st={}; try{ st=JSON.parse(localStorage.getItem('pb_join')||'{}'); }catch(e){}
  if(st.joined) return;
  if(st.later && Date.now()-st.later < 3*864e5) return;   // asked again after 3 days
  const save=o=>{ try{ localStorage.setItem('pb_join',JSON.stringify(o)); }catch(e){} };
  const ov=sheet('',`<div class="joinpop"><img src="${$('.mark').src}" alt="">
      <h4>انضمي لجروب PicksBuy 💬</h4>
      <p>كل المنتجات الجديدة والعروض بتنزل في الجروب الأول.</p>
      <ul><li>🛍️ منتجات أصلية من بره مصر</li><li>🔥 عروض وخصومات قبل أي حد</li><li>🚚 شحن لكل المحافظات</li></ul></div>`,
    `<button class="btn" id="jLater">مش دلوقتي</button><a class="btn g" id="jGo" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(g)}">انضمي للجروب</a>`);
  ov.onclosed=()=>save({later:Date.now()});
  ov.querySelector('#jLater').onclick=()=>ov.close();
  ov.querySelector('#jGo').addEventListener('click',()=>{ ov.onclosed=null; save({joined:1}); setTimeout(()=>ov.close(),300); });
}

/* ---------- links: #order-XXX, #p-ID, #admin ---------- */
function clearHash(){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
async function route(){
  const h=decodeURIComponent(location.hash||'');
  if(h==='#admin'){ clearHash(); const {data:{session}}=await sb.auth.getSession(); if(!session) openLogin(); return; }
  if(h.startsWith('#p-')){ const id=h.slice(3); clearHash(); if(S.products.find(x=>x.id===id)) openDetail(id); else toast('المنتج ده مش متاح دلوقتي'); return; }
  if(h.startsWith('#order-')){ const no=h.slice(7); clearHash(); openOrder(no); }
}
async function openOrder(no){
  if(!S.canEdit){ toast('سجّل دخول الأدمن علشان تشوف الطلب'); openLogin(()=>openOrder(no)); return; }
  let o=null;
  try{ o=ok(await sb.from('orders').select('*').eq('order_no',no).maybeSingle()); }catch(e){}
  if(!o){ toast('مش لاقيين الطلب ده'); return; }
  const c=o.customer||{}, d=new Date(o.created_at);
  const rows=(o.items||[]).map(l=>{ const p=S.products.find(x=>x.id===l.id); const im=p&&p.images&&p.images[0];
    return `<div class="cl">${im?`<img src="${img(im)}" alt="">`:'<div class="ni"></div>'}
      <div class="i">${l.brand?`<div class="brand-l" style="font-size:10px">${esc(l.brand)}</div>`:''}<div class="n">${esc(l.name)}</div>
      ${l.v?`<div class="v">${esc(l.v)}</div>`:''}<div class="p">${fmt(num(l.price))} ${esc(cur())} × ${l.n}</div></div></div>`; }).join('');
  const ov=sheet(`طلب <span dir="ltr">${esc(o.order_no)}</span>`,`
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="hint">${d.toLocaleDateString('ar-EG')} ${d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span><span class="pill st-${esc(o.status)}">${ST[o.status]||esc(o.status)}</span></div>
    ${holdLeft(o)?`<div class="hint">${holdLeft(o)}</div>`:''}
    <div style="font-weight:800;margin-top:6px">${esc(c.name||'')}${(o.phone||c.phone)?` · <span dir="ltr">${esc(o.phone||c.phone)}</span>`:''}</div>
    ${(o.gov||c.gov||c.addr)?`<div class="hint">${esc([o.gov||c.gov,c.addr].filter(Boolean).join(' - '))}</div>`:''}${c.note?`<div class="hint">ملاحظات: ${esc(c.note)}</div>`:''}
    ${rows}<div class="tot"><span>الإجمالي</span><b>${fmt(num(o.total)+(num(o.shipping)||0))} ${esc(cur())}</b></div>${num(o.shipping)?`<div class="hint" style="text-align:left">شامل شحن ${fmt(num(o.shipping))}</div>`:''}
    <div class="obtns">${orderButtons(o)}</div>`,
    `<button class="btn" data-close>تمام</button>`);
  ov.querySelector('.obtns').addEventListener('click',async e=>{ const b=e.target.closest('[data-ost]'); if(!b) return; const [id,st]=b.dataset.ost.split('|'); if(await setOrderStatus(+id,st)) ov.close(); });
}

/* ---------- boot ---------- */
(async()=>{
  if(!sb){ S.ready=true; note('الموقع لسه متوصلش بقاعدة البيانات.'); render(); return; }
  S.db=DB;
  S.timer=setTimeout(()=>{ if(!S.ready){ note('النت بطيء شوية… لسه بنحمّل المنتجات.'); } },10000);
  try{
    try{ const v=await sb.rpc('pb_version'); S.v2=!v.error && v.data>=2; }catch(e){ S.v2=false; }
    if(S.v2){ try{ await sb.rpc('release_expired'); }catch(e){} }
    await Promise.all(['countries','categories','products','settings'].map(refresh));
    S.ready=true; clearTimeout(S.timer); note(''); render();
  }catch(e){ S.ready=true; clearTimeout(S.timer); note('مقدرناش نحمّل المنتجات دلوقتي. جرّب تفتح الصفحة تاني.'); render(); }
  const pend={};
  sb.channel('pb-live').on('postgres_changes',{event:'*',schema:'public'},p=>{
    const t=p.table; if(!['products','countries','categories','settings'].includes(t)) return;
    clearTimeout(pend[t]); pend[t]=setTimeout(()=>refresh(t).catch(()=>{}),300);
  }).subscribe();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh('products').catch(()=>{}); });
  await checkAdmin();
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') setTimeout(checkAdmin,0); });
  const viaLink=/^#(order-|admin)/.test(location.hash);
  route();
  if(!viaLink) maybeJoinPopup();
  window.addEventListener('hashchange',route);
})();
</script>
