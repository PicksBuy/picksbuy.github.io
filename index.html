<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicksBuy | منتجات أصلية من كل العالم</title>
<meta name="description" content="PicksBuy — ميكب وعناية بالبشرة والشعر وملابس من بره مصر. اطلب على واتساب.">
<meta property="og:title" content="PicksBuy 🛍️">
<meta property="og:description" content="منتجات أصلية من كل العالم — اطلب على واتساب">
<meta property="og:image" content="img/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="img/icon.jpg">
<link rel="apple-touch-icon" href="img/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@500;600;700&family=Pacifico&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F2F0; --card:#fff; --ink:#1C1417; --muted:#7D6F72; --line:#ECDFDB; --soft:#F4E6E2;
  --rose:#C36C5E; --red:#A6303D; --ok:#2F7D57; --warn:#B4532A;
  --r:16px; --shadow:0 1px 2px rgba(60,20,25,.06),0 6px 20px rgba(60,20,25,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0}
.mark{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:0}
.brand b{font-family:Pacifico,cursive;font-weight:400;font-size:22px;line-height:1.85;direction:ltr;align-self:flex-start;padding:0 2px;margin:-9px 0 0}
.brand b span{color:var(--red)}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{display:none;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--soft);font-weight:700;font-size:13px;white-space:nowrap}
.mode.on{background:var(--ink);color:#fff}
.search{display:flex;gap:8px;padding:0 0 10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;outline:none}
.search input:focus{border-color:var(--rose)}
.search select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 8px}

/* chips */
.rail{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip .n{font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:0 7px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .n{background:rgba(255,255,255,.18);color:#fff}
.rail.sub .chip{padding:5px 11px;font-size:13px;background:transparent}
.rail.sub .chip.on{background:var(--rose);border-color:var(--rose)}
.lbl{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}

/* grid */
.bar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;gap:8px}
.bar h2{margin:0;font-size:17px}
.bar span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:28px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:920px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;position:relative}
.ph{position:relative;aspect-ratio:4/5;background:linear-gradient(135deg,#F6ECE9,#FBF5F3)}
.ph img{width:100%;height:100%;object-fit:cover}
.noimg{width:100%;height:100%;display:grid;place-items:center;color:#d3b9b2;font-size:34px}
.flag{position:absolute;top:8px;inset-inline-start:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.off{position:absolute;top:8px;inset-inline-end:8px;background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;direction:ltr}
.sold{position:absolute;inset:0;background:rgba(28,20,23,.55);display:grid;place-items:center}
.sold b{background:#fff;color:var(--red);padding:4px 14px;border-radius:999px;font-size:13px}
.hidden-tag{position:absolute;bottom:8px;inset-inline-start:8px;background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px}
.body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{margin:0;font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto}
.price b,.price s,.dprice b,.dprice s{direction:ltr;unicode-bidi:isolate}
.price b{color:var(--red);font-size:16px;font-weight:800}
.price s{color:var(--muted);font-size:12px}
.sz{font-size:12px;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm{display:flex;border-top:1px solid var(--line)}
.adm button{flex:1;padding:8px 0;font-size:13px;font-weight:700}
.adm button+button{border-inline-start:1px solid var(--line);color:var(--red)}

/* promo */
.promo{margin-top:12px;border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,#3a1418 0%,#120c0e 55%,#0b0809 100%);color:#fff;padding:18px 16px 14px;position:relative;overflow:hidden}
.promo:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 20%,rgba(195,108,94,.35),transparent 40%),radial-gradient(circle at 90% 85%,rgba(166,48,61,.4),transparent 45%);pointer-events:none}
.promo>*{position:relative}
.ptop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ptitle{text-transform:uppercase;font-family:Anton,Impact,sans-serif;font-size:38px;line-height:.95;letter-spacing:1px;direction:ltr;text-align:left}
.ptitle span{color:#E8A090}
.psub{font-weight:700;font-size:14px;color:#F3D6CF;margin-top:6px}
.pall{flex:none;background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.cd{display:flex;gap:6px;margin-top:10px;direction:ltr;justify-content:flex-end}
.cd div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:4px 8px;text-align:center;min-width:48px}
.cd b{display:block;font-size:18px;font-family:Anton,sans-serif;letter-spacing:.5px}
.cd small{font-size:10px;color:#d9c3be}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:0 16px 4px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px;background:#fff;color:var(--ink);border-radius:14px;overflow:hidden;cursor:pointer;scroll-snap-align:start}
.mini .im{aspect-ratio:4/5;background:var(--soft)}
.mini .im img{width:100%;height:100%;object-fit:cover}
.mini .t{padding:6px 8px 8px}
.mini .br{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pr{font-size:14px;font-weight:800;color:var(--red);direction:ltr;text-align:right}
.mini.sold .im{opacity:.45}
.chip.bf{background:#120c0e;color:#fff;border-color:#120c0e}
.chip.bf.on{background:var(--red);border-color:var(--red)}
.ribbon{position:absolute;bottom:0;left:0;right:0;background:rgba(18,12,14,.88);color:#fff;font-family:Anton,Impact,sans-serif;letter-spacing:1.5px;font-size:12px;text-align:center;padding:4px 0 3px;direction:ltr}
.ribbon span{color:#E8A090}
.mini .nm,.body h3,.dname,.sz{unicode-bidi:plaintext;text-align:right}
.brand-l{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* cart */
.cartbtn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:26;display:none;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-weight:800;box-shadow:0 10px 28px rgba(28,20,23,.35);white-space:nowrap}
.cartbtn .c{background:var(--red);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.cartbtn .t{direction:ltr;opacity:.9}
body:not(.admin) .cartbtn.has{display:flex}
.addq{position:absolute;bottom:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.ribbon~.addq{bottom:32px}
.vch{border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:700;direction:ltr;background:#fff}
.vch.on{border-color:var(--ink);background:var(--ink);color:#fff}
.vch:disabled{color:#bbb;text-decoration:line-through}
.vch.sw{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 5px;border-radius:999px}
.vch.sw img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(0,0,0,.08);padding:0!important;background:#eee}
.vch.sw.on img{border-color:#fff}
.swbig{display:none;align-items:center;gap:12px;margin:8px 0 2px;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff}
.swbig.on{display:flex}
.swbig img{width:132px;height:132px;border-radius:12px;object-fit:contain;background:#fff;padding:0!important;cursor:zoom-in}
.swbig b{direction:ltr;font-size:15px}
.szl span img{width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:-4px;margin-inline-end:5px;padding:0!important}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;flex:none}
.qty button{width:40px;height:44px;font-size:20px;font-weight:700}
.qty b{min-width:26px;text-align:center}
.cl{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cl img,.cl .ni{width:62px;height:76px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
.cl .i{flex:1;min-width:0}
.cl .i .n{font-weight:700;font-size:14px;unicode-bidi:plaintext;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .i .v{font-size:12px;color:var(--muted)}
.cl .i .p{font-weight:800;color:var(--red);direction:ltr;text-align:right;font-size:14px}
.cl .qty button{width:32px;height:34px;font-size:17px}
.cl .rmv{color:var(--muted);font-size:12px;text-decoration:underline;margin-top:2px}
.cl.bad{opacity:.5}
.tot{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;font-weight:800;font-size:17px}
.tot b{color:var(--red);direction:ltr;font-size:20px}
.ok-ic{font-size:46px;text-align:center;margin:6px 0}
.impbar{margin-top:12px;background:#fff;border:2px dashed var(--rose);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.impbar b{flex:1;font-size:14px}.impbar button{background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;white-space:nowrap}
.impl label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.impl img{width:54px;height:68px;object-fit:cover;border-radius:10px;flex:none}.impl input{width:20px;height:20px;accent-color:var(--red);flex:none}
.impl .t{flex:1;min-width:0}.impl .n{font-weight:700;font-size:13.5px;unicode-bidi:plaintext;text-align:right}
.joinpop{text-align:center;padding:4px 4px 0}
.joinpop img{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);margin:0 auto 8px}
.joinpop h4{margin:4px 0;font-size:19px}.joinpop p{margin:4px 0 10px;color:var(--muted);line-height:1.8;font-size:14px}
.joinpop ul{list-style:none;padding:0;margin:0 0 6px;text-align:right;display:inline-block}.joinpop li{margin:4px 0;font-weight:600;font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800}
.st-new{background:#FFF1D6;color:#8A5300}.st-confirmed{background:#E2F0FF;color:#1D4F91}.st-shipped{background:#EDE4FF;color:#5B2FB0}
.st-delivered{background:#E3F4EA;color:#1F6B43}.st-cancelled,.st-expired{background:#F1EAEA;color:#8B6F6F}
.obtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.obtns button,.obtns a{border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;background:var(--soft);text-decoration:none;color:var(--ink)}
.obtns .go{background:var(--ink);color:#fff}.obtns .no{color:var(--red)}.obtns .wa{background:#E7F8EE;color:#1F7A47}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.kpi{background:var(--soft);border-radius:12px;padding:8px;text-align:center}
.kpi b{display:block;font-size:18px;direction:ltr}.kpi small{color:var(--muted);font-size:11px;font-weight:700}
.minil{font-size:13px;line-height:1.9;margin:0 0 10px}.sect{font-weight:800;margin:14px 0 6px;font-size:14px}
.reqbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 10px;font-weight:800;font-size:13px;white-space:nowrap}
.reqcard{grid-column:1/-1;background:linear-gradient(135deg,#fff,#FBEFEC);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.reqcard b{display:block;font-size:16px;margin-bottom:4px}.reqcard button{margin-top:10px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800}
.shipnote{margin-top:10px;background:#EEF7F1;border:1px solid #D2EBDB;color:#1F6B43;border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700}
.zrow{display:grid;grid-template-columns:1fr 90px 34px;gap:6px;margin-bottom:6px}.zrow input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;outline:none}
.zrow button{border-radius:10px;background:var(--soft)}
.search{position:relative;padding:0 0 8px}
.search .si{position:absolute;inset-inline-start:13px;top:9px;font-size:20px;color:var(--muted);pointer-events:none;line-height:1}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 42px;outline:none;transition:border-color .2s, box-shadow .2s}
.search input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(195,108,94,.12)}
.search input::-webkit-search-cancel-button{display:none}
.search .qx{position:absolute;inset-inline-end:8px;top:7px;width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:18px;display:none}
.search.has .qx{display:block}
.tools{display:flex;gap:8px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}
.tb{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap;transition:transform .15s, background .2s}
.tb:active{transform:scale(.96)}.tb .ic{font-size:15px;color:var(--rose)}
.tb .bd{background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:none;place-items:center;padding:0 5px}
.tb .bd.on{display:grid}.tb.on{border-color:var(--ink)}
.tb.hl{background:linear-gradient(135deg,#1C1417,#3a1a1f);color:#fff;border-color:transparent;margin-inline-start:auto}
.rail.act{padding-top:8px}.rail.act:empty{display:none}
.achip{flex:none;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.achip i{font-style:normal;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px}
.achip.clr{background:transparent;color:var(--red);border:1px dashed var(--rose)}
.fsec{margin-bottom:16px}.fsec>b{display:block;font-size:14px;margin-bottom:8px}
.fchips{display:flex;flex-wrap:wrap;gap:7px}.fchips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.prange{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.prange input{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;width:100%;outline:none}
.sopt{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700;width:100%;text-align:start}
.sopt.on{color:var(--red)}.sopt.on:after{content:"✓";font-weight:900}
.tags{position:absolute;top:8px;inset-inline-end:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tags span{border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tg-off{background:var(--red);color:#fff;direction:ltr}.tg-new{background:#fff;color:var(--ink)}.tg-last{background:#FFE8B8;color:#7A4A00}
.card{transition:transform .18s ease, box-shadow .25s ease;animation:pop .45s ease both}
.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(60,20,25,.06),0 14px 34px rgba(60,20,25,.12)}.card:hover .ph img{transform:scale(1.05)}}
.ph{overflow:hidden}.ph img{transition:transform .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.2s}.card:nth-child(n+7){animation-delay:.24s}
.addq{transition:transform .15s}.addq:active{transform:scale(.88)}
.chip{transition:background .2s,color .2s,transform .15s}.chip:active{transform:scale(.95)}
header{box-shadow:0 1px 0 var(--line),0 6px 18px rgba(60,20,25,.04)}
.empty .btn{display:inline-block;width:auto;margin-top:12px;padding:10px 20px}
.fav{position:absolute;bottom:10px;inset-inline-start:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);font-size:17px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:transform .15s}
.fav:active{transform:scale(.85)}.fav.on{color:var(--red)}
.ribbon~.fav{bottom:32px}
.galw{position:relative}.galbtns{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:8px;z-index:2}
.galbtns button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.galbtns button.on{color:var(--red)}
.zoom{position:fixed;inset:0;z-index:80;background:rgba(10,6,8,.94);display:flex;align-items:center;justify-content:center;animation:fd .15s}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.zoom button{position:absolute;top:14px;inset-inline-end:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px}
.askfab{position:fixed;bottom:16px;inset-inline-start:16px;z-index:26;width:50px;height:50px;border-radius:50%;background:#25D366;color:#fff;display:none;place-items:center;font-size:23px;text-decoration:none;box-shadow:0 8px 22px rgba(37,211,102,.38)}
body:not(.admin) .askfab.on{display:grid}
.totop{position:fixed;bottom:76px;inset-inline-end:16px;z-index:24;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s}
.totop.on{opacity:1;pointer-events:auto}
.xsec{margin:6px 0 26px}.xsec h2{font-size:17px;margin:0 0 10px}
.howto{display:block;width:100%;max-width:360px;margin:0 auto 14px;border-radius:18px;box-shadow:var(--shadow);background:#000;aspect-ratio:9/16}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.step .n{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--soft);font-size:18px}
.step b{display:block;font-size:13.5px}.step span{font-size:11.5px;color:var(--muted);line-height:1.5;display:block;margin-top:2px}
.revs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-bottom:4px}.revs::-webkit-scrollbar{display:none}
.revs img{flex:none;width:200px;height:260px;object-fit:cover;object-position:top;border-radius:16px;box-shadow:var(--shadow);scroll-snap-align:start;background:#fff;cursor:zoom-in}
.radm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.radm .t{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft)}
.radm .t img{width:100%;height:100%;object-fit:cover}.radm .t button{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}
.ph img[src^="http"],.mini .im img[src^="http"],.gal img[src^="http"],.cl img[src^="http"],.impl img[src^="http"]{object-fit:contain;background:#fff;padding:6%}
.gal img[src^="http"]{padding:4%}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:42px}
.note{background:#FFF4E5;border:1px solid #F3D9B5;color:#7A4A12;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}

.fab{position:fixed;bottom:18px;inset-inline-start:18px;z-index:25;display:none;align-items:center;gap:8px;background:var(--red);color:#fff;font-weight:800;border-radius:999px;padding:13px 20px;box-shadow:0 8px 24px rgba(166,48,61,.35)}
.fab2{position:fixed;bottom:18px;inset-inline-end:18px;z-index:25;display:none;align-items:center;gap:6px;background:#fff;color:var(--ink);font-weight:700;border-radius:999px;padding:12px 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
body.admin .fab, body.admin .fab2{display:flex}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(28,20,23,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh h3{margin:0;font-size:17px}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px;line-height:1}
.sb{padding:14px 16px;overflow-y:auto;flex:1}
.sf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.btn{flex:1;border-radius:12px;padding:12px;font-weight:800;background:var(--soft)}
.btn.p{background:var(--ink);color:#fff}
.btn.r{background:var(--red);color:#fff}
.btn.g{background:#25D366;color:#fff}
.btn:disabled{opacity:.5}

/* detail */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--soft);border-radius:14px;aspect-ratio:4/5;max-height:62vh;margin:0 auto}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;background:#fff}
.dots{display:flex;justify-content:center;gap:5px;margin:8px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--rose)}
.dname{font-size:18px;font-weight:800;margin:6px 0 2px;line-height:1.4}
.meta{color:var(--muted);font-size:13px}
.dprice{display:flex;align-items:baseline;gap:10px;margin:10px 0}
.dprice b{font-size:24px;color:var(--red);font-weight:800}
.dprice s{color:var(--muted)}
.desc{white-space:pre-wrap;line-height:1.7;font-size:14px;margin:6px 0 12px}
.szl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.szl span{border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:700;direction:ltr}
.szl span small{color:var(--muted);font-weight:600;margin-inline-start:4px}
.szl span.no{color:#bbb;text-decoration:line-through}

/* form */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.f>label{font-weight:700;font-size:13px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--rose)}
.f textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.imgs .t{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--soft)}
.imgs .t img{width:100%;height:100%;object-fit:cover}
.imgs .t .rm{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.imgs .t .mv{position:absolute;bottom:4px;inset-inline-start:4px;background:rgba(255,255,255,.9);border-radius:8px;font-size:11px;padding:1px 6px;font-weight:700}
.imgs .t.main{outline:3px solid var(--rose);outline-offset:-3px}
.imgs .t .spin{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);font-size:12px;font-weight:700}
.add{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-weight:700;font-size:14px}
.sw input{width:20px;height:20px;accent-color:var(--red)}
.srow{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;margin-bottom:8px}
.srow input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;outline:none}
.srow button{border-radius:10px;background:var(--soft);font-size:16px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.presets button{border:1px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;direction:ltr}
.ghost{border:1px dashed var(--rose);color:var(--rose);border-radius:12px;padding:8px;font-weight:700;width:100%}

/* manage */
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;padding:8px 2px;border-radius:9px;font-weight:700;font-size:12.5px;white-space:nowrap}
.tabs button.on{background:#fff;box-shadow:var(--shadow)}
.mrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mrow input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;min-width:0}
.mrow input.fl{width:52px;text-align:center;flex:none}
.mrow input.nm{flex:1}
.mrow .ib{width:32px;height:36px;border-radius:9px;background:var(--soft);flex:none;font-size:13px}
.mrow .ib.d{color:var(--red)}
.mrow .cnt{font-size:11px;color:var(--muted);flex:none;min-width:26px;text-align:center}
.subs{margin-inline-start:22px;border-inline-start:2px solid var(--soft);padding-inline-start:8px}
.grp{border:1px solid var(--line);border-radius:12px;padding:10px 10px 4px;margin-bottom:10px}
.newrow{display:flex;gap:6px;margin-top:10px}
.newrow input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none;min-width:0}
.newrow button{background:var(--ink);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;flex:none}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.skel{background:linear-gradient(90deg,#efe5e2,#f8f1ef,#efe5e2);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);aspect-ratio:3/4}
@keyframes sk{to{background-position:-200% 0}}

/* ================= Rose Luxe theme + motion ================= */
:root{--bg:#FCF5F3;--ink:#2A1A1F;--muted:#8A7479;--line:#F0DFDA;--soft:#F9EAE6;--rose:#C9776A;--red:#B23A48;
  --rg:linear-gradient(135deg,#B76E79 0%,#E2A797 48%,#C98276 100%);--rg2:linear-gradient(135deg,#2A1A1F,#5A2A33);
  --r:20px;--shadow:0 1px 2px rgba(120,50,60,.05),0 10px 28px rgba(150,70,80,.09);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
body{background:radial-gradient(900px 500px at 110% -10%,#F9DCD5 0%,transparent 60%),radial-gradient(700px 500px at -20% 30%,#FBE8E3 0%,transparent 60%),var(--bg);background-attachment:fixed}
header{background:rgba(255,250,249,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(240,223,218,.8);transition:box-shadow .3s}
header.scr{box-shadow:0 10px 30px rgba(150,70,80,.10)}
.mark{border:2px solid transparent;background:var(--rg) border-box;box-shadow:0 4px 14px rgba(183,110,121,.25)}
.brand b span{background:var(--rg);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar h2,.xsec h2{font-family:"El Messiri",Cairo,sans-serif;font-weight:700;font-size:19px;letter-spacing:.2px}
.bar h2:before,.xsec h2:before{content:"✦";font-size:12px;margin-inline-end:6px;background:var(--rg);-webkit-background-clip:text;background-clip:text;color:transparent;vertical-align:3px}
.search input{border-radius:999px;background:rgba(255,255,255,.9)}
.tb{border-radius:999px}
.tb.hl{background:var(--rg2);box-shadow:0 6px 18px rgba(90,42,51,.25);position:relative;overflow:hidden}
.tb.hl:after,.cartbtn:after,.bfgo:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 3.6s var(--ease) infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
.chip{border-color:var(--line);background:rgba(255,255,255,.85)}
.chip.on{background:var(--rg);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(183,110,121,.35)}
.rail.sub .chip.on{background:var(--ink);border-color:var(--ink)}
.chip.bf{background:var(--rg2);border-color:transparent}
/* cards */
.card{border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(240,223,218,.6)}
.ph{background:linear-gradient(160deg,#FBF1EE,#fff)}
.ph img{opacity:0;transition:opacity .6s var(--ease),transform .7s var(--ease)}
.ph img.ld,.ph img[data-fb]{opacity:1}
.body h3{font-weight:700;font-size:14.5px;line-height:1.45}
.price b{background:linear-gradient(135deg,#9E2F3D,#C9776A);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.addq{background:var(--rg);box-shadow:0 6px 16px rgba(183,110,121,.45);transition:transform .25s var(--spring)}
.addq:active{transform:scale(.8)}
.fav{transition:transform .3s var(--spring)}
.fav.on{color:#D2475C}
.tg-new{background:linear-gradient(135deg,#fff,#FFF3EF);color:#9E2F3D}
.tg-off{background:var(--rg2)}
html.rv .card{animation:none;opacity:0;transform:translateY(22px) scale(.98);transition:opacity .7s var(--ease),transform .7s var(--ease),box-shadow .25s}
html.rv .card.in{opacity:1;transform:none}
@media(hover:hover){html.rv .card.in:hover{transform:translateY(-4px)}}
/* promo hero */
.promo{border-radius:26px;background:radial-gradient(120% 140% at 100% 0%,#4A1A22 0%,#1A0F12 55%,#0F0A0B 100%);box-shadow:0 18px 40px rgba(42,26,31,.28);padding-bottom:16px}
.ptitle{background:linear-gradient(110deg,#fff 0%,#fff 38%,#F6C9BC 48%,#fff 58%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gold 4.5s linear infinite}
.ptitle span{background:linear-gradient(110deg,#E8A090,#FFD9CC,#E8A090);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes gold{to{background-position:-250% 0}}
.pall{background:var(--rg);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cd div{backdrop-filter:blur(6px);background:rgba(255,255,255,.08)}
.cd b{animation:tickp 1s var(--ease)}
.spk{position:absolute;font-style:normal;color:#F6C9BC;pointer-events:none;animation:twk 3s ease-in-out infinite;text-shadow:0 0 12px rgba(246,201,188,.8)}
.spk.s1{top:14px;left:42%;font-size:12px}.spk.s2{top:56px;left:18px;font-size:16px;animation-delay:.8s}.spk.s3{bottom:62px;right:14px;font-size:10px;animation-delay:1.5s}.spk.s4{top:20px;right:40%;font-size:9px;animation-delay:2.2s}
@keyframes twk{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.bfx{margin:14px -4px 0;position:relative;touch-action:pan-y}
.bft{display:flex;transition:transform .75s var(--ease);will-change:transform}
.bfs{flex:0 0 100%;display:grid;grid-template-columns:44% 1fr;gap:14px;align-items:center;padding:4px;cursor:pointer}
.bfi{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.bfi img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 4.5s linear}
.bfs.on .bfi img{transform:scale(1.0)}
.bfi img[src^="http"]{object-fit:contain;padding:6%}
.bfoff{position:absolute;top:8px;inset-inline-end:8px;background:var(--rg);color:#fff;font-weight:800;font-size:12.5px;border-radius:999px;padding:2px 9px;direction:ltr;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bfc{color:#fff;min-width:0;opacity:0;transform:translateX(-18px);transition:opacity .6s .15s var(--ease),transform .6s .15s var(--ease)}
.bfs.on .bfc{opacity:1;transform:none}
.bfc .br{font-size:10.5px;letter-spacing:1.6px;color:#E8B4A6;font-weight:700;text-transform:uppercase;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfc .nm{font-family:"Playfair Display","El Messiri",serif;font-style:italic;font-size:19px;line-height:1.3;margin:4px 0 8px;unicode-bidi:plaintext;text-align:right;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bfc .pr{display:flex;gap:8px;align-items:baseline;justify-content:flex-start;direction:ltr;flex-direction:row-reverse}
.bfc .pr b{font-size:21px;font-weight:800;color:#fff}
.bfc .pr s{color:#c9a9a3;font-size:13px}
.bfc .so{color:#c9a9a3;font-weight:700}
.bfgo{position:relative;overflow:hidden;display:inline-block;margin-top:12px;background:var(--rg);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:13px;box-shadow:0 8px 20px rgba(183,110,121,.4)}
.bfs.sold .bfi{opacity:.5}
.bfd{display:flex;justify-content:center;gap:6px;margin-top:12px}
.bfd i{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.25);transition:width .5s var(--ease),background .4s;cursor:pointer;position:relative;overflow:hidden}
.bfd i.on{width:26px;background:rgba(255,255,255,.25)}
.bfd i.on:after{content:"";position:absolute;inset:0;background:#F6C9BC;transform-origin:left;animation:prog var(--bfms,4200ms) linear forwards}
.bfx.paused .bfd i.on:after{animation-play-state:paused}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* cart button & fly */
.cartbtn{background:var(--rg2);box-shadow:0 14px 34px rgba(42,26,31,.38);overflow:hidden}
.cartbtn .c{background:var(--rg)}
.cartbtn.bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.14)}65%{transform:translateX(-50%) scale(.96)}100%{transform:translateX(-50%) scale(1)}}
.cartbtn .c.pop{animation:cpop .5s var(--spring)}
@keyframes cpop{40%{transform:scale(1.6)}}
.flyimg{position:fixed;z-index:120;border-radius:16px;object-fit:cover;pointer-events:none;box-shadow:0 12px 30px rgba(42,26,31,.35);background:#fff}
.burst{position:fixed;z-index:121;pointer-events:none;font-style:normal;font-size:14px;color:#D2475C}
/* sheets */
.ov{background:rgba(42,26,31,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fd .3s var(--ease)}
.sheet{border-radius:26px 26px 0 0;animation:up .5s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.ov.out{pointer-events:none;animation:fdo .28s var(--ease) forwards}.ov.out .sheet{animation:dn .3s var(--ease) forwards}
@keyframes fdo{to{opacity:0}}@keyframes dn{to{transform:translateY(100%)}}
.sh h3{font-family:"El Messiri",Cairo,sans-serif;font-size:19px}
.btn{border-radius:999px;transition:transform .2s var(--spring)}.btn:active{transform:scale(.96)}
.btn.r{background:var(--rg);box-shadow:0 8px 20px rgba(183,110,121,.35)}
.btn.p{background:var(--rg2)}
.vch{border-radius:999px;transition:transform .25s var(--spring),background .2s,border-color .2s}
.vch:active{transform:scale(.92)}
.vch.on{background:var(--rg2);border-color:transparent;box-shadow:0 6px 14px rgba(90,42,51,.25)}
.swbig.on{animation:swin .45s var(--ease)}
@keyframes swin{from{opacity:0;transform:translateY(8px) scale(.97)}}
.cl{animation:clin .5s var(--ease) both}
@keyframes clin{from{opacity:0;transform:translateX(-14px)}}
.cl:nth-child(2){animation-delay:.05s}.cl:nth-child(3){animation-delay:.1s}.cl:nth-child(n+4){animation-delay:.15s}
.dprice b{background:linear-gradient(135deg,#9E2F3D,#C9776A);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
.dname{font-family:"Playfair Display","El Messiri",serif;font-style:italic;font-size:21px}
/* toast */
.toast{background:var(--rg2);transform:translate(-50%,16px) scale(.96);transition:opacity .3s var(--ease),transform .45s var(--spring);box-shadow:0 12px 28px rgba(42,26,31,.3)}
.toast.on{transform:translate(-50%,0) scale(1)}
/* success */
.okani{width:86px;height:86px;margin:4px auto 8px;display:block}
.okani circle{fill:none;stroke:url(#okg);stroke-width:4;stroke-dasharray:240;stroke-dashoffset:240;animation:draw .8s var(--ease) forwards}
.okani path{fill:none;stroke:#B23A48;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .65s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.conf{position:fixed;top:-12px;z-index:130;width:8px;height:12px;border-radius:2px;pointer-events:none}
@keyframes tickp{from{opacity:.4;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

    if(!S.admin) $('#grid').insertAdjacentHTML('beforeend',`<div class="reqcard"><b>مش لاقية اللي عايزاه؟ ✨</b><span class="hint">ابعتيلنا اسم المنتج أو لينكه ونجيبهولك من أي بلد</span><br><button data-req="1">اطلبي منتج من بره</button></div>`);

function renderPromo(all){
  const box=$('#promo');
  const items = promoOn() ? all.filter(isPromo).sort((a,b)=>(stock(b)>0)-(stock(a)>0)||(b.createdAt||'').localeCompare(a.createdAt||'')) : [];

    <button class="pall" id="pall">شوف الكل (${items.length})</button></div>

      <div class="bfi">${p.images?.length?`<img src="${img(p.images[0])}" ${i?'loading="lazy"':''} alt="">`:''}${d&&!so?`<span class="bfoff">-${d}%</span>`:''}</div>
      <div class="bfc">${p.brand?`<div class="br">${esc(p.brand)}</div>`:''}<div class="nm">${esc(p.name)}</div>
        <div class="pr">${so?'<span class="so">نفدت</span>':`<b>${fmt(num(p.price))} ${esc(cur())}</b>${num(p.oldPrice)>num(p.price)?`<s>${fmt(num(p.oldPrice))}</s>`:''}`}</div>
        ${so?'':`<span class="bfgo">${variants(p)?'اختاري الدرجة ←':'أضيفي للسلة ＋'}</span>`}</div></div>`; }).join('')}</div>
      ${items.length>1?`<div class="bfd">${items.map((_,i)=>`<i data-bi="${i}"></i>`).join('')}</div>`:''}</div>
    <i class="spk s1">✦</i><i class="spk s2">✧</i><i class="spk s3">✦</i><i class="spk s4">✧</i>

function tick(){
  const el=$('#cd'), pr=S.settings.promo; if(!el||!pr?.ends) return;
  const ms=new Date(pr.ends+'T23:59:59')-new Date(); if(ms<=0){ el.innerHTML=''; return; }
  const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60;
  el.innerHTML=`<div><b>${d}</b><small>DAYS</small></div><div><b>${h}</b><small>HRS</small></div><div><b>${m}</b><small>MIN</small></div>`;
}

/* ================= motion helpers ================= */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let LAST_IMG=null, LAST_PT=null;
document.addEventListener('pointerdown',e=>{
  LAST_PT={x:e.clientX,y:e.clientY};
  const host=e.target.closest('.card,.bfs,.sheet'); LAST_IMG=null; if(!host) return;
  let im=null;
  if(host.classList.contains('sheet')){ const g=host.querySelector('.gal'); if(g){ const r=g.getBoundingClientRect(); im=[...g.querySelectorAll('img')].find(i=>{const b=i.getBoundingClientRect(); return b.left>=r.left-5&&b.right<=r.right+5;})||g.querySelector('img'); } }
  else im=host.querySelector('.ph img, .bfi img');
  LAST_IMG=im;
},true);
function burst(el,chars){
  if(RM) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  chars.forEach((c,i)=>{ const b=document.createElement('i'); b.className='burst'; b.textContent=c; b.style.left=cx-6+'px'; b.style.top=cy-8+'px';
    if(i%2) b.style.color='#E2A797'; document.body.appendChild(b);
    const a=(Math.PI*2*i/chars.length)+Math.random()*.6, d=34+Math.random()*26;
    b.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-10}px) scale(1.2)`,opacity:0}],{duration:700+Math.random()*250,easing:'cubic-bezier(.22,1,.36,1)'}).onfinish=()=>b.remove(); });
}
function flyToCart(){
  const btn=$('#cartBtn'), cn=$('#cartN');
  const pop=()=>{ btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump'); cn.classList.remove('pop'); void cn.offsetWidth; cn.classList.add('pop'); };
  if(LAST_PT && document.elementFromPoint(LAST_PT.x,LAST_PT.y)) { const t=document.elementFromPoint(LAST_PT.x,LAST_PT.y).closest('.addq,#addc,.bfgo'); if(t) burst(t,['✦','✧','✦','✧','✦']); }
  if(RM||!LAST_IMG||!LAST_IMG.isConnected){ pop(); return; }
  const s=LAST_IMG.getBoundingClientRect(); if(!s.width){ pop(); return; }
  const c=LAST_IMG.cloneNode(); c.className='flyimg'; c.removeAttribute('loading');
  const w=Math.min(s.width,170), h=w*1.25, x0=s.left+(s.width-w)/2, y0=s.top+(s.height-h)/2;
  Object.assign(c.style,{left:x0+'px',top:y0+'px',width:w+'px',height:h+'px'}); document.body.appendChild(c);
  requestAnimationFrame(()=>{ const t=btn.getBoundingClientRect(); const tx=(t.left+t.width/2)-(x0+w/2), ty=(t.top+t.height/2)-(y0+h/2);
    const mx=tx*.45, my=Math.min(ty*.2,-80);
    c.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1,borderRadius:'16px'},
               {transform:`translate(${mx}px,${my}px) scale(.62) rotate(-8deg)`,opacity:1,offset:.45},
               {transform:`translate(${tx}px,${ty}px) scale(.12) rotate(12deg)`,opacity:.6,borderRadius:'50%'}],
      {duration:850,easing:'cubic-bezier(.55,0,.35,1)'}).onfinish=()=>{ c.remove(); pop(); }; });
}
function confetti(){
  if(RM) return; const cols=['#B76E79','#E2A797','#F6C9BC','#B23A48','#2A1A1F','#FFD9CC'];
  for(let i=0;i<46;i++){ const d=document.createElement('i'); d.className='conf'; d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
    if(i%3===0) d.style.borderRadius='50%'; document.body.appendChild(d);
    const dx=(Math.random()-.5)*160, rot=Math.random()*720-360, dur=1800+Math.random()*1400;
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${innerHeight+40}px) rotate(${rot}deg)`,opacity:.9}],{duration:dur,delay:Math.random()*300,easing:'cubic-bezier(.25,.6,.4,1)'}).onfinish=()=>d.remove(); }
}
/* Black Friday hero slider */
const BF={i:0,n:0,t:null,ms:4200,dragged:false,
  go(i,user){ const x=$('#bfx'); if(!x) return; this.n=x.querySelectorAll('.bfs').length; if(!this.n) return;
    this.i=(i+this.n)%this.n; x.querySelector('.bft').style.transform=`translateX(${this.i*100}%)`;
    x.querySelectorAll('.bfs').forEach((s,k)=>s.classList.toggle('on',k===this.i));
    x.querySelectorAll('.bfd i').forEach((d,k)=>{ d.classList.remove('on'); if(k===this.i){ void d.offsetWidth; d.classList.add('on'); } });
    this.arm(user?7000:this.ms); },
  arm(ms){ clearTimeout(this.t); const x=$('#bfx'); if(!x||this.n<2) return; x.style.setProperty('--bfms',ms+'ms'); this.t=setTimeout(()=>{ if(document.hidden||!this.vis){ this.arm(this.ms); return; } this.go(this.i+1); },ms); },
  vis:true };
function startBF(){
  const x=$('#bfx'); if(!x) return; BF.go(0);
  if('IntersectionObserver' in window){ if(BF.io) BF.io.disconnect(); BF.vis=true; BF.io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.target===$('#bfx')) BF.vis=en.isIntersecting; }); }); BF.io.observe(x); }
  let sx=0, sy=0, dx=0, on=false; const tr=x.querySelector('.bft');
  x.addEventListener('pointerdown',e=>{ on=true; sx=e.clientX; sy=e.clientY; dx=0; BF.dragged=false; clearTimeout(BF.t); x.classList.add('paused'); });
  x.addEventListener('pointermove',e=>{ if(!on) return; dx=e.clientX-sx; if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-sy)){ BF.dragged=true; tr.style.transition='none'; tr.style.transform=`translateX(calc(${BF.i*100}% + ${dx}px))`; } });
  const end=()=>{ if(!on) return; on=false; x.classList.remove('paused'); tr.style.transition='';
    if(BF.dragged && Math.abs(dx)>40) BF.go(BF.i+(dx>0?1:-1),true); else BF.go(BF.i,true); setTimeout(()=>BF.dragged=false,50); };
  x.addEventListener('pointerup',end); x.addEventListener('pointercancel',end); x.addEventListener('pointerleave',end);
}
/* image fade-in + scroll reveal */
document.addEventListener('load',e=>{ const t=e.target; if(t.tagName==='IMG') t.classList.add('ld'); },true);
const REV = ('IntersectionObserver' in window) && !RM ? new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); REV.unobserve(en.target); } }),{rootMargin:'0px 0px -6% 0px'}) : null;
if(REV) document.documentElement.classList.add('rv');

  if(REV){ let k=0; document.querySelectorAll('.card:not(.in)').forEach(c=>{ const r=c.getBoundingClientRect(); if(r.top<innerHeight){ c.style.transitionDelay=(k++*55)+'ms'; requestAnimationFrame(()=>c.classList.add('in')); setTimeout(()=>c.style.transitionDelay='',900); } else REV.observe(c); }); }
}

/* phone Back button closes the open window instead of leaving the site */
let NAV_IGNORE=0;
function topLayer(){ const z=document.querySelectorAll('.zoom, .ov:not(.out)'); return z[z.length-1]; }
function pushNav(){ if(!(history.state&&history.state.pb)) { try{ history.pushState({pb:1},''); }catch(e){} } }
function popNav(){ if(!topLayer() && history.state&&history.state.pb){ NAV_IGNORE++; history.back(); } }
window.addEventListener('popstate',()=>{
  if(NAV_IGNORE>0){ NAV_IGNORE--; if(topLayer()) pushNav(); return; }
  const t=topLayer(); if(!t) return;
  t._byBack=true; t.close();
  if(topLayer()) pushNav();
});

const SORTS={new:'الأحدث',low:'السعر: الأقل الأول',high:'السعر: الأعلى الأول',avail:'المتاح الأول',off:'أكبر خصم'};
let FAV=[]; try{ FAV=JSON.parse(localStorage.getItem('pb_fav')||'[]')||[]; }catch(e){ FAV=[]; }
const isFav=id=>FAV.includes(id);
function toggleFav(id){ const fb=document.querySelector(`[data-fav="${CSS.escape(id)}"]`); if(fb&&!isFav(id)) burst(fb,['♥','♥','✦','♥','✧','♥']); FAV=isFav(id)?FAV.filter(x=>x!==id):[...FAV,id]; try{ localStorage.setItem('pb_fav',JSON.stringify(FAV)); }catch(e){} toast(isFav(id)?'اتضافت للمفضلة ❤️':'اتشالت من المفضلة'); render(); }
function isNewP(p){ return p.createdAt && Date.now()-new Date(p.createdAt).getTime() < 2*864e5; }
function applyExtra(list){
  if(S.favOnly) list=list.filter(p=>isFav(p.id));
  if(S.inStock) list=list.filter(p=>stock(p)>0);
  if(S.minP!=null) list=list.filter(p=>(num(p.price)||0)>=S.minP);
  if(S.maxP!=null) list=list.filter(p=>(num(p.price)||0)<=S.maxP);
  if(S.brands.length) list=list.filter(p=>S.brands.includes((p.brand||'').trim()));
  return list;
}
function activeFilters(){
  const a=[];
  if(S.promoOnly) a.push({k:'promo',l:'🔥 '+(S.settings.promo?.title||'العروض'),clear:()=>S.promoOnly=false});
  if(S.country!=='all'){ const c=country(S.country); a.push({k:'country',l:(c?.flag||'')+' '+(c?.name||''),clear:()=>S.country='all'}); }
  if(S.cat!=='all'){ a.push({k:'cat',l:(S.sub!=='all'?cat(S.sub):cat(S.cat))?.name||'',clear:()=>{S.cat='all';S.sub='all';}}); }
  if(S.favOnly) a.push({k:'fav',l:'❤️ المفضلة',clear:()=>S.favOnly=false});
  if(S.inStock) a.push({k:'stock',l:'المتاح بس',clear:()=>S.inStock=false});
  if(S.minP!=null||S.maxP!=null) a.push({k:'price',l:S.minP!=null&&S.maxP!=null?`${fmt(S.minP)} - ${fmt(S.maxP)}`:S.minP!=null?`من ${fmt(S.minP)}`:`لحد ${fmt(S.maxP)}`,clear:()=>{S.minP=null;S.maxP=null;}});
  S.brands.forEach(b=>a.push({k:'b:'+b,l:b,clear:()=>S.brands=S.brands.filter(x=>x!==b)}));
  return a;
}

function openFilters(){
  const T={favOnly:S.favOnly,country:S.country,cat:S.cat,sub:S.sub,promoOnly:S.promoOnly,inStock:S.inStock,minP:S.minP,maxP:S.maxP,brands:[...S.brands]};
  const base=visible();
  const brandsAll=[...new Set(base.map(p=>(p.brand||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const countriesAll=[...S.countries].sort(byOrder).filter(c=>base.some(p=>p.countryId===c.id));
  const mains=S.cats.filter(c=>!c.parentId).sort(byOrder).filter(m=>base.some(p=>mainCatOf(p)===m.id));
  const presets=[[null,200,'أقل من 200'],[200,500,'200 - 500'],[500,1000,'500 - 1000'],[1000,null,'فوق 1000']];

      <div class="fsec"><b>البلد</b><div class="fchips"><button data-c="all" class="${T.country==='all'?'on':''}">🌍 الكل</button>${countriesAll.map(c=>`<button data-c="${esc(c.id)}" class="${T.country===c.id?'on':''}">${esc((c.flag||'')+' '+c.name)}</button>`).join('')}</div></div>

        ${subs.length?`<div class="fchips" style="margin-top:8px">${subs.map(s2=>`<button data-s="${esc(s2.id)}" class="${T.sub===s2.id?'on':''}" style="font-size:12px">${esc(s2.name)}</button>`).join('')}</div>`:''}</div>

    else if(b.dataset.c) T.country=b.dataset.c; else if(b.dataset.k){ T.cat=b.dataset.k; T.sub='all'; }
    else if(b.dataset.s) T.sub=T.sub===b.dataset.s?'all':b.dataset.s;

/* ---------- sheet helper ---------- */
function sheet(title, bodyHTML, footHTML){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="sheet"><div class="sh"><h3>${title}</h3><button class="x" data-close>×</button></div><div class="sb">${bodyHTML}</div>${footHTML?`<div class="sf">${footHTML}</div>`:''}</div>`;
  document.body.appendChild(ov);

  ov.close=()=>{ if(ov._closed||!ov.isConnected) return; ov._closed=true; ov.classList.add('out'); setTimeout(()=>ov.remove(),320); if(!document.querySelector('.ov:not(.out)')) document.body.style.overflow=''; if(!ov._byBack) popNav(); ov.onclosed&&ov.onclosed(); };
  ov.addEventListener('click',e=>{ if(e.target===ov || e.target.closest('[data-close]')) ov.close(); });

}
function ask(msg, okText='تمام', danger=true){

    const ov=sheet('تأكيد', `<p style="margin:4px 0 6px;line-height:1.7">${msg}</p>`,
      `<button class="btn" data-close>إلغاء</button><button class="btn ${danger?'r':'p'}" id="okb">${okText}</button>`);

/* ---------- detail ---------- */
function waText(p){
  const c=country(p.countryId), o=num(p.oldPrice), n=num(p.price);
  const lines=[[p.brand,p.name].filter(Boolean).join(' - ')];
  if (p.desc) lines.push(p.desc);
  if (c) lines.push(`${c.flag||''} من ${c.name}`.trim());
  const sz=(p.sizes||[]).filter(s=>num(s.q)>0).map(s=>s.s);
  if (sz.length) lines.push('المتاح: '+sz.join(' - '));
  lines.push('');
  if (isPromo(p) && !(o&&n&&o>n)) { lines.push(`💥${String(S.settings.promo.title).toUpperCase()} OFFER💥 ${fmt(n)} ${cur()}`); }
  else if (o && n && o>n){ lines.push(`${fmt(o)} ${cur()}❌`,'',isPromo(p)?`💥${String(S.settings.promo.title).toUpperCase()} OFFER💥`:'💥OFFER PRICE💥','',`${fmt(n)} ${cur()} ✅`); }
  else if (n!=null) lines.push(`${fmt(n)} ${cur()} ✅`);
  if (stock(p)<=0) lines.push('','Sold out');
  lines.push('',`🛒 اطلبي من هنا: ${location.origin+location.pathname}#p-${p.id}`);
  return lines.join('\n');
}
function openDetail(id){

  const vs=variants(p);
  const sizes=!vs ? '' : S.admin
    ? `<div class="lbl">المتاح</div><div class="szl">${vs.map(s=>`<span class="${num(s.q)>0?'':'no'}">${s.img?`<img src="${img(s.img)}" alt="">`:''}${esc(s.s)}<small>(${num(s.q)||0})</small></span>`).join('')}</div>`
    : `<div class="lbl">اختار${vs.some(s=>s.img)?' الدرجة':''}</div><div class="szl" id="vsel">${vs.map((s,i)=>`<button class="vch${s.img?' sw':''}" data-vi="${i}" ${num(s.q)>0?'':'disabled'}>${s.img?`<img src="${img(s.img)}" alt="" loading="lazy">`:''}${esc(s.s)}</button>`).join('')}</div><div class="swbig" id="swbig"><img alt=""><b></b></div>`;
  const foot = S.admin
    ? `<button class="btn" id="cpy" style="flex:1.2">📋 بوست</button><button class="btn" id="sty">📸 ستوري</button><button class="btn p" id="ed">✏️ تعديل</button>`
    : (st>0 ? `<div class="qty"><button data-q="1">+</button><b id="qn">1</b><button data-q="-1">−</button></div><button class="btn r" id="addc">🛒 أضف للسلة</button>`
            : `<button class="btn" data-close>رجوع</button><button class="btn p" id="reqSim">✨ اطلبي زيه</button>`);

/* ---------- image compress ---------- */
async function loadImg(src){ return await new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function rrect(cx,x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
async function compress(file, enhance=true){
  const url=URL.createObjectURL(file), im=await loadImg(url);
  const iw=im.naturalWidth, ih=im.naturalHeight; let cv=document.createElement('canvas'), cx=cv.getContext('2d');
  if(!enhance){
    const sc=Math.min(1,1400/Math.max(iw,ih)); cv.width=Math.round(iw*sc); cv.height=Math.round(ih*sc);
    cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height);
  } else {
    // same look as the photos Claude prepared: soft blurred backdrop, photo centred with rounded corners and a light shadow
    const W=900,H=1125; cv.width=W; cv.height=H;
    const t=document.createElement('canvas'); t.width=24; t.height=30; const tc=t.getContext('2d');
    const cs=Math.max(24/iw,30/ih); tc.drawImage(im,(24-iw*cs)/2,(30-ih*cs)/2,iw*cs,ih*cs);
    cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high'; cx.drawImage(t,0,0,W,H);
    cx.fillStyle='rgba(250,246,244,.55)'; cx.fillRect(0,0,W,H);
    const s2=Math.min((W-50)/iw,(H-50)/ih), fw=iw*s2, fh=ih*s2, x=(W-fw)/2, y=(H-fh)/2;
    cx.save(); cx.shadowColor='rgba(90,60,60,.28)'; cx.shadowBlur=36; cx.shadowOffsetY=12; rrect(cx,x,y,fw,fh,24); cx.fillStyle='#fff'; cx.fill(); cx.restore();
    cx.save(); rrect(cx,x,y,fw,fh,24); cx.clip(); cx.drawImage(im,x,y,fw,fh); cx.restore();
  }
  URL.revokeObjectURL(url);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.86));
}

function wrapLines(cx,text,maxW,maxLines){ const words=String(text).split(/\s+/), lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(cx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; if(lines.length===maxLines) break; } else cur=t; }
  if(lines.length<maxLines && cur) lines.push(cur); return lines; }

function catOptions(sel){
  const mains=S.cats.filter(c=>!c.parentId).sort(byOrder);
  return `<option value="">— اختار القسم —</option>` + mains.map(m=>{
    const subs=S.cats.filter(c=>c.parentId===m.id).sort(byOrder);
    return `<option value="${esc(m.id)}" ${sel===m.id?'selected':''}>${esc(m.name)}</option>` +
      subs.map(s=>`<option value="${esc(s.id)}" ${sel===s.id?'selected':''}>&nbsp;&nbsp;&nbsp;↳ ${esc(s.name)}</option>`).join('');
  }).join('');
}
function openForm(p){
  const isNew=!p || !!p.__copy;
  const F = {
    images:[...(p?.images||[])].map(id=>({id})),
    hasSizes: p ? !!(p.sizes&&p.sizes.length) : false,
    sizes: (p?.sizes||[]).map(s=>({s:s.s,q:s.q,...(s.img?{img:s.img}:{}),...(s.photo?{photo:s.photo}:{})})),
    fresh:[] // uploaded during this form
  };
  const defCountry = p?.countryId || (S.country!=='all'?S.country:'');
  const defCat = p?.categoryId || (S.sub!=='all'?S.sub:(S.cat!=='all'?S.cat:''));
  const ov=sheet(isNew?'منتج جديد':'تعديل المنتج', `
    <div class="f"><label>الصور</label><div class="imgs" id="imgs"></div><div class="hint">أول صورة هي اللي بتظهر في الكارت. دوس "رئيسية" على أي صورة تخليها الأولى.</div>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <label class="sw" style="margin:8px 0 0">✨ تحسين الصور تلقائي (نفس شكل باقي الموقع) <input type="checkbox" id="fEnh" ${localStorage.getItem('pb_enh')==='0'?'':'checked'}></label></div>
    <div class="row2">
      <div class="f"><label>البراند</label><input id="fBrand" value="${esc(p?.brand)}" placeholder="مثلاً: Lancôme" style="direction:ltr;text-align:right"></div>
      <div class="f"><label>اسم المنتج *</label><input id="fName" value="${esc(p?.name)}" placeholder="Lash Idôle Mascara" style="direction:ltr;text-align:right"></div>
    </div>
    <div class="row2">
      <div class="f"><label>البلد</label><select id="fCountry"><option value="">— اختار —</option>${[...S.countries].sort(byOrder).map(c=>`<option value="${esc(c.id)}" ${defCountry===c.id?'selected':''}>${esc(c.flag||'')} ${esc(c.name)}</option>`).join('')}</select></div>
      <div class="f"><label>القسم</label><select id="fCat">${catOptions(defCat)}</select></div>
    </div>
    <div class="row2">
      <div class="f"><label>السعر (${esc(cur())}) *</label><input id="fPrice" inputmode="decimal" value="${num(p?.price)>0?esc(p.price):''}" placeholder="1200"></div>
      <div class="f"><label>السعر قبل الخصم</label><input id="fOld" inputmode="decimal" value="${esc(p?.oldPrice??'')}" placeholder="اختياري"></div>
    </div>
    ${S.settings.promo?.title?`<label class="sw">🔥 ضمن عرض ${esc(S.settings.promo.title)} <input type="checkbox" id="fPromo" ${(p?p.promo:S.promoOnly)?'checked':''}></label>`:''}
    <label class="sw">فيه مقاسات أو ألوان أو أنواع؟ <input type="checkbox" id="fHas" ${F.hasSizes?'checked':''}></label>
    <div id="sizesBox"></div>
    <div class="f"><label>الوصف</label><textarea id="fDesc" placeholder="تفاصيل المنتج، الخامة، طريقة الاستخدام…">${esc(p?.desc)}</textarea></div>
    <label class="sw">إخفاء عن العملاء <input type="checkbox" id="fHidden" ${p?.hidden && num(p.price)>0 ?'checked':''}></label>
  `, `<button class="btn" data-close>إلغاء</button>${!isNew?'<button class="btn" id="dup">⧉ نسخة</button>':''}<button class="btn p" id="save">${isNew?'ضيف المنتج':'احفظ التعديل'}</button>`);
  const dp=ov.querySelector('#dup'); if(dp) dp.onclick=()=>{ ov.close(); openForm({...p,images:[],createdAt:null,__copy:true}); toast('نسخة جديدة، حطي الصور واحفظي'); };

  const q=s=>ov.querySelector(s);
  function drawImgs(){
    q('#imgs').innerHTML = F.images.map((im,i)=>`<div class="t ${i===0?'main':''}">
      ${im.id?`<img src="${img(im.id)}">`:(im.preview?`<img src="${im.preview}">`:'')}
      ${im.busy?`<div class="spin">بيرفع…</div>`:''}
      <button class="rm" data-rm="${i}">×</button>${i>0?`<button class="mv" data-main="${i}">رئيسية</button>`:''}</div>`).join('')
      + (S.assets ? `<button class="add" id="addImg">＋<br>صورة</button>` : `<div class="hint" style="grid-column:1/-1">رفع الصور متاح لصاحب الصفحة والمحررين بس.</div>`);
    const a=q('#addImg'); if(a) a.onclick=()=>q('#file').click();
  }
  q('#imgs').onclick=e=>{
    const r=e.target.closest('[data-rm]'); if(r){ F.images.splice(+r.dataset.rm,1); drawImgs(); return; }
    const m=e.target.closest('[data-main]'); if(m){ const [x]=F.images.splice(+m.dataset.main,1); F.images.unshift(x); drawImgs(); }
  };
  q('#file').onchange=async e=>{
    const files=[...e.target.files]; e.target.value='';
    for(const f of files){
      const slot={busy:true, preview:URL.createObjectURL(f)}; F.images.push(slot); drawImgs();
      try{
        const blob=await compress(f, q('#fEnh')?q('#fEnh').checked:true);
        const r=await S.assets.upload(blob,{type:'image/jpeg'});
        slot.id=r.id; slot.busy=false; F.fresh.push(r.id);
      }catch(err){
        F.images.splice(F.images.indexOf(slot),1);
        toast(err?.code==='quota_or_state'?'المساحة خلصت':'الصورة مارفعتش، جرّب تاني');
      }
      drawImgs();
    }
  };
  function drawSizes(){
    const box=q('#sizesBox');
    if(!F.hasSizes){
      box.innerHTML=`<div class="f"><label>الكمية المتاحة</label><input id="fQty" inputmode="numeric" value="${esc(p&&!(p.sizes&&p.sizes.length)?(p.qty??''):'1')}"></div>`;
      return;
    }
    box.innerHTML=`<div class="f"><label>المقاس / اللون / النوع، والكمية من كل واحد</label>
      ${F.sizes.map((s,i)=>`<div class="srow"><input data-ss="${i}" value="${esc(s.s)}" placeholder="مثلاً M أو أحمر"><input data-sq="${i}" inputmode="numeric" value="${esc(s.q)}" placeholder="العدد"><button data-sr="${i}">×</button></div>`).join('')}
      <div class="presets">${PRESETS.map(x=>`<button data-pre="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>
      <button class="ghost" id="addSz">＋ مقاس تاني</button></div>`;
  }
  q('#sizesBox').addEventListener('input',e=>{
    if(e.target.dataset.ss!=null) F.sizes[+e.target.dataset.ss].s=e.target.value;
    if(e.target.dataset.sq!=null) F.sizes[+e.target.dataset.sq].q=e.target.value;
  });
  q('#sizesBox').addEventListener('click',e=>{
    const r=e.target.closest('[data-sr]'); if(r){ F.sizes.splice(+r.dataset.sr,1); drawSizes(); return; }
    const pr=e.target.closest('[data-pre]'); if(pr){ if(!F.sizes.find(s=>s.s===pr.dataset.pre)) F.sizes.push({s:pr.dataset.pre,q:1}); drawSizes(); return; }
    if(e.target.id==='addSz'){ F.sizes.push({s:'',q:1}); drawSizes(); const ins=q('#sizesBox').querySelectorAll('[data-ss]'); ins[ins.length-1]?.focus(); }
  });
  q('#fHas').onchange=e=>{ F.hasSizes=e.target.checked; if(F.hasSizes&&!F.sizes.length) F.sizes=[]; drawSizes(); };
  drawImgs(); drawSizes();
  q('#fEnh').onchange=e=>{ try{ localStorage.setItem('pb_enh',e.target.checked?'1':'0'); }catch(x){} };

  let saved=false;
  ov.onclosed=async()=>{ if(!saved && S.assets) for(const id of F.fresh){ try{ await S.assets.delete(id); }catch(e){} } };

  q('#save').onclick=async()=>{
    const name=q('#fName').value.trim(), price=num(q('#fPrice').value);
    if(!name){ toast('اكتب اسم المنتج'); q('#fName').focus(); return; }
    if(price==null||price<=0){ toast('اكتب السعر'); q('#fPrice').focus(); return; }
    if(F.images.some(i=>i.busy)){ toast('استنى الصور تخلص رفع'); return; }
    const data={
      name, brand:q('#fBrand').value.trim(), desc:q('#fDesc').value.trim(),
      promo: q('#fPromo') ? q('#fPromo').checked : !!p?.promo,
      countryId:q('#fCountry').value||null, categoryId:q('#fCat').value||null,
      price, oldPrice:num(q('#fOld').value),
      images:F.images.filter(i=>i.id).map(i=>i.id),
      hidden:q('#fHidden').checked,
      updatedAt:new Date().toISOString(),
      createdAt:p?.createdAt||new Date().toISOString()
    };
    if(F.hasSizes){
      data.sizes=F.sizes.filter(s=>String(s.s).trim()).map(s=>({s:String(s.s).trim(),q:Math.max(0,Math.round(num(s.q)||0)),...(s.img?{img:s.img}:{}),...(s.photo?{photo:s.photo}:{})}));
      data.qty=null;
    } else { data.sizes=[]; data.qty=Math.max(0,Math.round(num(q('#fQty').value)||0)); }
    const btn=q('#save'); btn.disabled=true; btn.textContent='بيحفظ…';
    try{
      const ref = isNew ? S.db.collection('products').doc() : S.db.collection('products').doc(p.id);
      await ref.set(data);
      saved=true;
      const removed=(p?.images||[]).filter(id=>!data.images.includes(id));
      ov.onclosed=null; ov.close();
      toast(isNew?'المنتج اتضاف ✅':'اتحفظ ✅');
      if(S.assets) for(const id of removed){ try{ await S.assets.delete(id); }catch(e){} }
    }catch(e){
      btn.disabled=false; btn.textContent=isNew?'ضيف المنتج':'احفظ التعديل';
      toast(e?.code==='quota_exceeded'?'المساحة خلصت':'ماتحفظش، جرّب تاني');
    }
  };
  if(isNew) setTimeout(()=>q('#fName').focus(),250);
}

/* ---------- manage countries / categories / settings ---------- */
let manageOv=null, manageTab='countries';
function openManage(){
  manageOv=sheet('التقسيمات والإعدادات','<div class="tabs" id="mt"><button data-t="countries">🌍 البلاد</button><button data-t="cats">🗂️ الأقسام</button><button data-t="orders">🧾 الطلبات</button><button data-t="settings">⚙️ إعدادات</button></div><div id="mb"></div>');
  manageOv.onclosed=()=>{ manageOv=null; };
  manageOv.querySelector('#mt').onclick=e=>{ const b=e.target.closest('[data-t]'); if(b){ manageTab=b.dataset.t; drawManage(); } };
  const mb=manageOv.querySelector('#mb');
  mb.addEventListener('change',onManageChange);
  mb.addEventListener('click',onManageClick);
  drawManage();
}

      + `<div class="newrow"><input id="nFlag" placeholder="🏳️" style="width:56px;text-align:center"><input id="nName" placeholder="اسم البلد" style="flex:1"><button data-new="countries">إضافة</button></div>

    const mains=S.cats.filter(c=>!c.parentId).sort(byOrder);

        <span class="cnt">${pc(p=>mainCatOf(p)===m.id)}</span>
        <button class="ib" data-mv="categories|${esc(m.id)}|-1" ${i?'':'disabled'}>▲</button>
        <button class="ib" data-mv="categories|${esc(m.id)}|1" ${i<mains.length-1?'':'disabled'}>▼</button>
        <button class="ib d" data-rmc="categories|${esc(m.id)}">🗑</button></div>
        <div class="subs">${subs.map((s,j)=>`<div class="mrow">
          <input class="nm" data-keep="1" data-col="categories" data-id="${esc(s.id)}" data-f="name" value="${esc(s.name)}">
          <span class="cnt">${pc(p=>p.categoryId===s.id)}</span>
          <button class="ib" data-mv="categories|${esc(s.id)}|-1" ${j?'':'disabled'}>▲</button>
          <button class="ib" data-mv="categories|${esc(s.id)}|1" ${j<subs.length-1?'':'disabled'}>▼</button>

    mb.innerHTML=`
      <div class="f"><label>رقم الواتساب للطلبات</label><input id="sWa" inputmode="tel" value="${esc(S.settings.whatsapp)}" placeholder="مثلاً 201001234567" style="direction:ltr;text-align:right"><div class="hint">بكود الدولة من غير + . لما يتكتب، هيظهر للعميل زرار "اطلب على واتساب".</div></div>
      <div class="f"><label>العملة</label><input id="sCur" value="${esc(S.settings.currency||'L.E')}"></div>

        <div id="zones">${(shipZones().length?shipZones():[]).map(z=>zoneRow(z)).join('')}</div>
        <div style="display:flex;gap:6px"><button class="ghost" data-zadd="1">＋ منطقة</button>${shipZones().length?'':'<button class="ghost" data-zfill="1">املّي المحافظات</button>'}</div>
      </div>
      ${S.v2?`<div class="f"><label>⏳ مدة حجز الطلب لحد التأكيد (ساعات)</label><input id="sHold" inputmode="numeric" value="${esc(S.settings.holdHours??6)}"><div class="hint">الطلب اللي ماتأكدش في المدة دي بيتلغي لوحده والكمية ترجع. اكتبي 0 لو مش عايزة كده.</div></div>`:''}
      <div class="grp" style="padding:12px">
        <label class="sw" style="margin-bottom:12px">🔥 العرض شغّال <input type="checkbox" id="sPA" ${S.settings.promo?.active?'checked':''}></label>
        <div class="f"><label>اسم العرض</label><input id="sPT" value="${esc(S.settings.promo?.title||'')}" placeholder="Black Friday" style="direction:ltr;text-align:right"></div>
        <div class="f"><label>جملة تحت العرض</label><input id="sPS" value="${esc(S.settings.promo?.subtitle||'')}" placeholder="كل منتج بـ 250 L.E"></div>
        <div class="f" style="margin-bottom:4px"><label>آخر يوم في العرض (اختياري)</label><input id="sPE" type="date" value="${esc(S.settings.promo?.ends||'')}"><div class="hint">لو حطيته هيظهر عداد تنازلي، والعرض بيقفل لوحده بعد اليوم ده.</div></div>
      </div>
      <div class="grp" style="padding:12px"><div class="sect" style="margin-top:0">💬 آراء العملاء</div>
        <div class="hint">حطي سكرين شوت من رسايل العملاء الحلوة، وهتظهر في آخر الموقع.</div>
        <div class="radm" id="radm">${(S.settings.reviews||[]).map((r,i)=>`<div class="t"><img src="${img(r)}"><button data-rvrm="${i}">×</button></div>`).join('')}${S.assets?'<button class="add" data-rvadd="1" style="aspect-ratio:3/4">＋<br>صورة</button>':''}</div>
        <input type="file" id="rvFile" accept="image/*" multiple hidden></div>
      <div class="f"><label>لينك جروب الواتساب</label><input id="sGrp" inputmode="url" value="${esc(S.settings.group||'')}" placeholder="https://chat.whatsapp.com/..." style="direction:ltr;text-align:right"><div class="hint">لما يتحط، أي حد يفتح الموقع لأول مرة هيظهرله إعلان ينضم للجروب. من الجروب ← ⋮ ← Group info ← Invite via link ← Copy link.</div></div>
      <div class="f"><label>الجملة اللي تحت الاسم</label><input id="sTag" value="${esc(S.settings.tagline||'منتجات أصلية من كل العالم 🌍')}"></div>
      <button class="btn p" style="width:100%" id="sSave">احفظ الإعدادات</button>`;
  }
}
function nextOrder(list){ return list.reduce((m,x)=>Math.max(m,x.order??0),0)+1; }
async function onManageChange(e){
  const t=e.target; if(!t.dataset.col) return;
  const v=t.value.trim();
  if(t.dataset.f==='name' && !v){ toast('الاسم مينفعش يبقى فاضي'); drawManage(); return; }
  try{ await S.db.collection(t.dataset.col).doc(t.dataset.id).update({[t.dataset.f]:v}); toast('اتحفظ'); }
  catch(err){ toast('ماتحفظش'); }
}
async function onManageClick(e){
  const b=e.target.closest('button'); if(!b) return;
  try{
    if(b.dataset.new==='countries'){
      const name=manageOv.querySelector('#nName').value.trim(), flag=manageOv.querySelector('#nFlag').value.trim();
      if(!name) return toast('اكتب اسم البلد');
      await S.db.collection('countries').doc().set({name,flag,order:nextOrder(S.countries)}); toast('اتضاف');
    } else if(b.dataset.new==='categories'){
      const name=manageOv.querySelector('#nCat').value.trim(); if(!name) return toast('اكتب اسم القسم');
      await S.db.collection('categories').doc().set({name,parentId:null,order:nextOrder(S.cats.filter(c=>!c.parentId))}); toast('اتضاف');
    } else if(b.dataset.newsub){
      const pid=b.dataset.newsub, inp=manageOv.querySelector(`[data-subname="${CSS.escape(pid)}"]`), name=inp.value.trim();
      if(!name) return toast('اكتب اسم القسم الفرعي');
      await S.db.collection('categories').doc().set({name,parentId:pid,order:nextOrder(S.cats.filter(c=>c.parentId===pid))}); toast('اتضاف');
    } else if(b.dataset.mv){
      const [col,id,dir]=b.dataset.mv.split('|'); const all=col==='countries'?S.countries:S.cats;
      const me=all.find(x=>x.id===id);
      const sibs=all.filter(x=>col==='countries'||(x.parentId||null)===(me.parentId||null)).sort(byOrder);
      // normalise order first, then swap
      const i=sibs.indexOf(me), j=i+(+dir); if(j<0||j>=sibs.length) return;
      [sibs[i],sibs[j]]=[sibs[j],sibs[i]];
      for(let k=0;k<sibs.length;k++){ if(sibs[k].order!==k+1) await S.db.collection(col).doc(sibs[k].id).update({order:k+1}); }
    } else if(b.dataset.rmc){
      const [col,id]=b.dataset.rmc.split('|');
      if(col==='countries'){
        const n=S.products.filter(p=>p.countryId===id).length;
        if(n) return ask(`البلد ده فيه ${n} منتج. انقلهم لبلد تاني الأول من تعديل المنتج، وبعدين امسحه.`,'فهمت',false);
        if(!await ask(`تمسح <b>${esc(country(id)?.name)}</b>؟`,'امسح')) return;
      } else {
        const subs=S.cats.filter(c=>c.parentId===id).length;
        if(subs) return ask('القسم ده جواه أقسام فرعية. امسحهم الأول.','فهمت',false);
        const n=S.products.filter(p=>p.categoryId===id).length;
        if(n) return ask(`القسم ده فيه ${n} منتج. انقلهم لقسم تاني الأول.`,'فهمت',false);
        if(!await ask(`تمسح قسم <b>${esc(cat(id)?.name)}</b>؟`,'امسح')) return;
      }
      await S.db.collection(col).doc(id).delete(); toast('اتمسح');

const sb = (window.supabase && !SB_URL.startsWith('__')) ? window.supabase.createClient(SB_URL, SB_KEY) : null;

const KEY = {countries:'countries',categories:'cats',products:'products'};
function toRow(t,d){ const m=MAP[t]||{}, o={}; for(const k in d){ if(d[k]!==undefined) o[m[k]||k]=d[k]; } return o; }
function fromRow(t,r){ const m=MAP[t]||{}, inv={}; for(const k in m) inv[m[k]]=k; const o={}; for(const k in r) o[inv[k]||k]=r[k]; return o; }
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
function ok(r){ if(r.error) throw r.error; return r.data; }
const DB = {
  collection(t){ return { doc(id){ id=id||newId(); return {
    id,
    set: async d => { ok(await sb.from(t).upsert(toRow(t,{...d,id}))); await refresh(t); },
    update: async d => { ok(await sb.from(t).update(toRow(t,d)).eq('id',id)); await refresh(t); },
    delete: async () => { ok(await sb.from(t).delete().eq('id',id)); await refresh(t); }
  }; } }; },
  doc(){ return { set: async d => { ok(await sb.from('settings').upsert({id:1,data:d})); await refresh('settings'); } }; }
};

      `<button class="btn r" id="upCp">📋 انسخ الكود</button><a class="btn p" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://supabase.com/dashboard/project/iozwfbafomkwlhlbkcuq/sql/new">افتح SQL Editor</a>`);
